# Общая часть обоих api-серверов. Ставится в /etc/nginx/snippets/.

client_max_body_size 8k;          # §8 шаг 1: запрос мал по замыслу
large_client_header_buffers 4 4k;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# Приманки §12. Отдаются приложением, чтобы попадали в его телеметрию,
# а не терялись в логах nginx.
location ~ ^/(\.env|\.git/config|wp-login\.php|phpmyadmin|backup\.sql|admin)$ {
    proxy_pass http://127.0.0.1:8000;
    include /etc/nginx/proxy_params;
}

location / {
    proxy_pass http://127.0.0.1:8000;
    include /etc/nginx/proxy_params;
    proxy_set_header X-Forwarded-For $remote_addr;

    # Долгий опрос ?wait= (фаза 2): до 60 с плюс запас.
    proxy_read_timeout 75s;
    proxy_buffering off;
}
