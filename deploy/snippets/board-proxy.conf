# Общая часть обоих api-серверов. Ставится в /etc/nginx/snippets/.

client_max_body_size 8k;          # §8 шаг 1: запрос мал по замыслу
proxy_headers_hash_bucket_size 128;   # иначе nginx ругается на каждый старт
large_client_header_buffers 4 4k;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# Заголовки к приложению задаются здесь поимённо, а не через
# `include /etc/nginx/proxy_params`.
#
# Причина — 2026-11-20. `proxy_params` задаёт X-Forwarded-For через
# $proxy_add_x_forwarded_for, то есть дописывает адрес к присланному клиентом
# значению; следующая строка с тем же именем не заменяла его, а добавляла
# вторым заголовком с тем же именем. Приложение берёт первое вхождение и
# получало X-Forwarded-For: <что прислал клиент>, <настоящий адрес> — то есть
# псевдоним, бакет лимита и «три из двадцати» менялись одним заголовком.
# Здесь X-Forwarded-For равен $remote_addr и приходит одной строкой; клиентскую
# копию nginx не пропускает, потому что для этого имени есть proxy_set_header.

# Приманки §12. Отдаются приложением, чтобы попадали в его телеметрию,
# а не терялись в логах nginx.
location ~ ^/(\.env|\.git/config|wp-login\.php|phpmyadmin|backup\.sql|admin)$ {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location / {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Долгий опрос ?wait= (фаза 2): до 60 с плюс запас.
    proxy_read_timeout 75s;
    proxy_buffering off;
}
