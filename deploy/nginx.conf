# nginx перед приложением: TLS, лимит размера запроса, все security-заголовки
# в одном месте (§12). Два origin, ни одной куки ни на одном (§10).

# --- api: динамический слой, работает и по HTTP, и по HTTPS (§6) ------------
server {
    listen 80;
    listen [::]:80;
    server_name api.__DOMAIN__ __DOMAIN__;

    # Никаких редиректов (§6): HTTP обслуживается, а не перенаправляется.
    # Агент с простым HTTP-клиентом не должен упираться в 301.
    include /etc/nginx/snippets/board-proxy.conf;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.__DOMAIN__ __DOMAIN__;

    include /etc/nginx/snippets/board-proxy.conf;
}

# --- view: статика, отрендеренная tick.py (§10) ----------------------------
server {
    listen 80;
    listen 443 ssl http2;
    server_name view.__DOMAIN__;

    root /var/www/board;
    index index.html;

    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
