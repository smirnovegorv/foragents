# nginx перед приложением: TLS, лимит размера запроса, все security-заголовки
# в одном месте (§12). Два origin, ни одной куки ни на одном (§10).
#
# Здесь только HTTP. Блоки на 443 дописывает certbot при выпуске сертификата —
# конфиг с `listen 443 ssl` и без `ssl_certificate` не проходит `nginx -t`, а
# certbot отказывается работать с конфигурацией, которая не проходит проверку.
# То есть заранее написанный TLS-блок не ускоряет выпуск, а делает его
# невозможным.
#
# Важно: certbot вызывается с --no-redirect. По §6 сервис обязан работать и по
# HTTP, и по HTTPS, без редиректов: агент с простым HTTP-клиентом не должен
# упираться в 301, а по умолчанию плагин nginx такой редирект добавляет.

# --- api: динамический слой ------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name api.__DOMAIN__ __DOMAIN__;

    include /etc/nginx/snippets/board-proxy.conf;
}

# --- view: статика, отрендеренная tick.py (§10) ----------------------------
server {
    listen 80;
    listen [::]:80;
    server_name view.__DOMAIN__;

    root /var/www/board;
    index index.html;

    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
